[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spikes/m0-core", "spikes/m0-slint-mpv", "spikes/s1-oauth", "vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
youtus-core = { path = "crates/youtus-core" }
youtus-yt = { path = "crates/youtus-yt" }
youtus-auth = { path = "crates/youtus-auth" }
youtus-store = { path = "crates/youtus-store" }
youtus-ui = { path = "crates/youtus-ui" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ureq = { version = "2", features = ["json"] }
sha1 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
crossbeam-channel = "0.5"
slint = "1.19"
slint-build = "1.19"

[profile.release]
lto = "thin"
codegen-units = 1
